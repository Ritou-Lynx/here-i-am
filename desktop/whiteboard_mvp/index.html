<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>故我在 · 白板工作台 MVP</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="hia-app">
      <aside class="hia-sidebar" aria-label="主要导航">
        <div class="hia-sidebar-content">
          <a class="hia-brand" href="#home" aria-label="故我在工作台">
            <span class="hia-brand-mark" aria-hidden="true"></span>
            <span>故我在</span>
          </a>
          <nav class="hia-nav-list">
            <a class="hia-nav-item" href="#home" data-route="home"><span></span>首页</a>
            <a class="hia-nav-item" href="#boards" data-route="boards"><span></span>白板</a>
            <a class="hia-nav-item" href="#cards" data-route="cards"><span></span>卡片库</a>
          </nav>
          <div class="hia-sidebar-foot">
            <span class="hia-status-dot"></span>
            <span>本地 MVP</span>
          </div>
        </div>
        <button class="hia-sidebar-toggle" type="button" aria-label="收起侧栏" aria-expanded="true">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" /></svg>
        </button>
      </aside>

      <main class="hia-workspace" aria-live="polite"></main>

      <button class="hia-i-trigger" type="button" aria-label="打开林埃悬浮对话" aria-expanded="false"><span class="hia-i-mark" aria-hidden="true"></span></button>
      <section class="hia-i-popover" aria-label="林埃悬浮对话" hidden>
        <div class="hia-chat-bubble">当前 MVP 已带上正在查看的页面和白板。</div>
        <div class="hia-chat-bubble hia-chat-user">把刚才那张卡放到白板右侧。</div>
        <form class="hia-chat-input">
          <input aria-label="给林埃发送消息" placeholder="输入要求…" />
          <button type="submit" aria-label="发送">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m3.5 3.5 13 6.5-13 6.5 2-6.5-2-6.5Z" /><path d="M5.5 10h7" /></svg>
          </button>
        </form>
      </section>

      <div class="hia-toast" role="status" aria-live="polite" hidden></div>
    </div>

    <script type="module" src="./src/app.mjs"></script>
  </body>
</html>
