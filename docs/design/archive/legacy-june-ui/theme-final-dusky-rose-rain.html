<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Here I Am · 成熟微醺色彩方向 · Tokenized UI</title>
  <style>
    /*
      HERE I AM · MATURE MICRO-TIPSY THEME · ABSTRACT FROSTED VERSION
      ------------------------------------------------------------
      This file is intentionally tokenized for Codex / productization.
      Replace only the variables in :root and [data-theme="..."] to build
      new skins while keeping the same component structure.

      Token layers:
      1. Foundation tokens: page, typography, glass, rain, shadow.
      2. Theme tokens: --theme-bg, --theme-soft, --theme-mid, --theme-deep, --theme-ink.
      3. Component tokens: derived via color-mix() from the active theme.
    */

    :root {
      color-scheme: dark;

      /* Mood background tokens: abstract, non-photographic. No literal bar background. */
      --page-w: 1448px;
      --page-h: 1086px;
      --mood-bg-0: #0B090D;
      --mood-bg-1: #171018;
      --mood-bg-2: #211821;
      --ambient-copper: rgba(112, 63, 39, .20);
      --ambient-rose: rgba(118, 58, 77, .18);
      --ambient-plum: rgba(83, 65, 97, .22);
      --ambient-champagne: rgba(186, 154, 118, .12);

      /* Typography tokens */
      --font-ui: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif: "Times New Roman", "Noto Serif SC", "Songti SC", STSong, serif;
      --text-primary: #ead2c2;
      --text-secondary: rgba(235, 209, 196, .72);
      --text-muted: rgba(230, 202, 190, .52);
      --letter-wide: .08em;

      /* Glass / surface tokens */
      --glass-blur: 22px;
      --glass-saturation: .92;
      --glass-fill-a: rgba(255, 255, 255, .058);
      --glass-fill-b: rgba(255, 255, 255, .018);
      --glass-stroke: rgba(238, 205, 191, .28);
      --glass-stroke-strong: rgba(255, 226, 213, .38);
      --glass-edge: rgba(255, 236, 226, .32);
      --card-radius: 26px;
      --inner-radius: 19px;
      --shadow-soft: 0 28px 80px rgba(0, 0, 0, .34);
      --shadow-card: 0 22px 54px rgba(0, 0, 0, .28), inset 0 1px rgba(255,255,255,.20);

      /* Rain / condensation tokens */
      --rain-opacity: .18;
      --rain-micro-opacity: .10;
      --rain-streak-opacity: .13;
      --mist-opacity: .72;

      /* Layout tokens, tuned to match the generated reference image */
      --page-pad-x: 48px;
      --page-pad-top: 42px;
      --grid-gap-x: 22px;
      --grid-gap-y: 16px;
      --theme-min-h: 420px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #050406;
      color: var(--text-primary);
      font-family: var(--font-ui);
    }

    body {
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    .stage {
      position: relative;
      width: min(100vw, var(--page-w));
      min-height: min(100vh, var(--page-h));
      overflow: hidden;
      isolation: isolate;
      padding: var(--page-pad-top) var(--page-pad-x) 42px;
      background:
        radial-gradient(ellipse at 18% 12%, var(--ambient-plum), transparent 35%),
        radial-gradient(ellipse at 78% 20%, var(--ambient-champagne), transparent 32%),
        radial-gradient(ellipse at 43% 48%, var(--ambient-rose), transparent 42%),
        radial-gradient(ellipse at 72% 78%, var(--ambient-copper), transparent 34%),
        linear-gradient(145deg, var(--mood-bg-0), var(--mood-bg-1) 52%, var(--mood-bg-2));
    }

    /* abstract matte atmosphere, not a photographed scene */
    .stage::before {
      content: "";
      position: absolute;
      inset: -10%;
      z-index: -3;
      background:
        linear-gradient(115deg, rgba(255,255,255,.045), transparent 22% 78%, rgba(255,255,255,.025)),
        radial-gradient(ellipse at 25% 30%, rgba(122, 95, 124, .12), transparent 38%),
        radial-gradient(ellipse at 75% 55%, rgba(126, 77, 65, .10), transparent 42%);
      filter: blur(18px) saturate(.9);
      transform: scale(1.04);
    }

    /* foreground misted glass haze */
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: var(--mist-opacity);
      background:
        radial-gradient(circle at 24% 28%, rgba(255,255,255,.08), transparent 16%),
        radial-gradient(circle at 78% 42%, rgba(255,235,216,.06), transparent 20%),
        linear-gradient(90deg, rgba(255,255,255,.035), transparent 18% 82%, rgba(255,255,255,.026));
      mix-blend-mode: screen;
    }

    .rain-layer,
    .rain-layer::before,
    .rain-layer::after {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .rain-layer {
      z-index: 8;
      opacity: var(--rain-opacity);
      /* Keep only a few tiny beads; main effect is the flowing trace layer below. */
      background:
        radial-gradient(ellipse at 23% 18%, rgba(255,236,222,.46) 0 1px, transparent 2.4px),
        radial-gradient(ellipse at 67% 22%, rgba(255,236,222,.38) 0 .9px, transparent 2.2px),
        radial-gradient(ellipse at 91% 58%, rgba(255,236,222,.40) 0 1px, transparent 2.5px);
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.46));
    }

    /* very fine matte condensation grain */
    .rain-layer::before {
      content: "";
      opacity: var(--rain-micro-opacity);
      background-image:
        radial-gradient(circle, rgba(255,255,255,.45) 0 .45px, transparent .70px),
        radial-gradient(circle, rgba(255,255,255,.18) 0 .38px, transparent .62px);
      background-size: 28px 34px, 43px 51px;
      background-position: 2px 6px, 12px 14px;
      mask-image: linear-gradient(to bottom, transparent, #000 9%, #000 87%, transparent);
    }

    /* flowing rain traces: water sliding down fogged glass, not round drops */
    .rain-layer::after {
      content: "";
      opacity: var(--rain-streak-opacity);
      background:
        linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,.26) 18.08%, rgba(255,255,255,.08) 18.18%, transparent 18.32%),
        linear-gradient(90deg, transparent 0 51%, rgba(255,255,255,.20) 51.08%, rgba(255,255,255,.07) 51.20%, transparent 51.38%),
        linear-gradient(90deg, transparent 0 76%, rgba(255,255,255,.18) 76.04%, rgba(255,255,255,.06) 76.16%, transparent 76.28%),
        linear-gradient(180deg, transparent 0 8%, rgba(255,255,255,.10) 18%, transparent 33%, rgba(255,255,255,.08) 54%, transparent 76%);
      filter: blur(.55px);
      mask-image: linear-gradient(to bottom, transparent 0, #000 8%, #000 91%, transparent 100%);
    }

    header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 7px;
      font-family: var(--font-serif);
      color: var(--text-primary);
      font-size: clamp(31px, 3.5vw, 43px);
      font-weight: 500;
      letter-spacing: .03em;
      line-height: 1.04;
      text-shadow: 0 10px 30px rgba(0,0,0,.38);
    }

    .intro {
      margin: 0;
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.7;
      letter-spacing: .025em;
    }

    .badge {
      flex: 0 0 auto;
      margin-top: 10px;
      min-width: 260px;
      text-align: center;
      border-radius: 999px;
      padding: 11px 18px 10px;
      color: rgba(238, 209, 201, .72);
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(247, 216, 204, .18);
      box-shadow: inset 0 1px rgba(255,255,255,.16), 0 18px 36px rgba(0,0,0,.20);
      backdrop-filter: blur(14px) saturate(1.15);
      font-size: 14px;
      letter-spacing: .05em;
    }

    .grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--grid-gap-y) var(--grid-gap-x);
    }

    .theme {
      --theme-bg: #1A121A;
      --theme-soft: #2A1826;
      --theme-mid: #5A3A4D;
      --theme-deep: #D9C6D6;
      --theme-ink: #F0DCE7;
      --theme-accent: var(--theme-deep);

      position: relative;
      overflow: hidden;
      min-height: var(--theme-min-h);
      border-radius: var(--card-radius);
      padding: 22px 20px 17px;
      background:
        radial-gradient(circle at 74% 26%, color-mix(in srgb, var(--theme-deep) 18%, transparent), transparent 24%),
        radial-gradient(circle at 42% 60%, color-mix(in srgb, var(--theme-mid) 34%, transparent), transparent 36%),
        linear-gradient(138deg,
          color-mix(in srgb, var(--theme-bg) 82%, rgba(255,255,255,.08)),
          color-mix(in srgb, var(--theme-soft) 74%, rgba(255,255,255,.06)) 46%,
          color-mix(in srgb, var(--theme-bg) 72%, var(--theme-mid))
        );
      border: 1px solid color-mix(in srgb, var(--theme-deep) 26%, rgba(255,255,255,.20));
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturation));
    }

    .theme::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, rgba(255,255,255,.16), transparent 32% 76%, rgba(255,255,255,.075)),
        radial-gradient(circle at 0% 0%, rgba(255,255,255,.13), transparent 33%);
      opacity: .46;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .theme::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .26;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.50) 0 .55px, transparent .8px),
        radial-gradient(circle, rgba(255,255,255,.25) 0 .45px, transparent .65px);
      background-size: 21px 28px, 34px 41px;
      background-position: 8px 9px, 19px 4px;
      mask-image: linear-gradient(to bottom, transparent 0, #000 13%, #000 86%, transparent);
    }

    .theme-head {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: start;
    }

    .title strong {
      display: block;
      color: color-mix(in srgb, var(--theme-ink) 92%, var(--text-primary));
      font-family: var(--font-serif);
      font-size: 25px;
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: .11em;
      text-shadow: 0 10px 26px rgba(0,0,0,.30);
    }

    .title .en {
      display: block;
      margin-top: 2px;
      color: color-mix(in srgb, var(--theme-ink) 68%, var(--text-secondary));
      font-family: var(--font-serif);
      font-size: 14px;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .notes {
      margin-top: 13px;
      color: color-mix(in srgb, var(--theme-ink) 78%, var(--text-muted));
      font-size: 14px;
      letter-spacing: .10em;
    }

    .swatches {
      display: flex;
      gap: 8px;
      padding-top: 5px;
    }

    .swatches i {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--swatch);
      border: 1px solid rgba(255, 233, 223, .42);
      box-shadow: 0 10px 24px rgba(0,0,0,.25), inset 0 1px rgba(255,255,255,.28);
    }

    .sample-card {
      position: relative;
      z-index: 1;
      min-height: 274px;
      margin-top: 17px;
      padding: 23px 22px 20px;
      overflow: hidden;
      border-radius: var(--inner-radius);
      background:
        radial-gradient(circle at 72% 54%, color-mix(in srgb, var(--theme-mid) 20%, transparent), transparent 29%),
        linear-gradient(150deg,
          color-mix(in srgb, var(--theme-deep) 13%, rgba(255,255,255,.105)),
          rgba(255,255,255,.045) 48%,
          color-mix(in srgb, var(--theme-bg) 44%, rgba(255,255,255,.038))
        );
      border: 1px solid color-mix(in srgb, var(--theme-deep) 28%, rgba(255,255,255,.26));
      box-shadow:
        inset 0 1px rgba(255,255,255,.22),
        inset 0 -1px rgba(255,255,255,.07),
        0 24px 50px rgba(0,0,0,.24);
      backdrop-filter: blur(22px) saturate(1.18);
    }

    .sample-card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .26;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.50) 0 .55px, transparent .85px),
        radial-gradient(circle, rgba(255,255,255,.23) 0 .45px, transparent .65px);
      background-size: 17px 23px, 29px 35px;
      background-position: 7px 4px, 11px 12px;
    }

    .sample-card::after {
      content: "";
      position: absolute;
      inset: 1px;
      pointer-events: none;
      border-radius: calc(var(--inner-radius) - 1px);
      background: linear-gradient(110deg, rgba(255,255,255,.10), transparent 38% 82%, rgba(255,255,255,.06));
      mix-blend-mode: screen;
    }

    .state {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 999px;
      padding: 4px 10px;
      color: rgba(248, 222, 214, .68);
      background: rgba(0, 0, 0, .17);
      border: 1px solid rgba(255,255,255,.11);
      font-size: 12px;
      line-height: 1;
      letter-spacing: .05em;
    }

    .state::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--theme-accent);
      box-shadow: 0 0 16px color-mix(in srgb, var(--theme-accent) 42%, transparent);
    }

    .sample-card h2 {
      position: relative;
      z-index: 1;
      margin: 32px 0 12px;
      color: color-mix(in srgb, var(--theme-ink) 94%, #fff);
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 520;
      letter-spacing: .05em;
    }

    .sample-card p {
      position: relative;
      z-index: 1;
      max-width: 92%;
      margin: 0;
      color: color-mix(in srgb, var(--theme-ink) 78%, rgba(255,255,255,.72));
      font-size: 14px;
      line-height: 1.8;
      letter-spacing: .02em;
    }

    .quote {
      position: relative;
      z-index: 1;
      margin-top: 22px;
      padding-left: 13px;
      border-left: 2px solid var(--theme-accent);
      color: color-mix(in srgb, var(--theme-ink) 70%, rgba(255,255,255,.74));
      font-size: 14px;
      letter-spacing: .04em;
    }

    .foot {
      position: absolute;
      z-index: 2;
      left: 22px;
      right: 17px;
      bottom: 19px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .tags {
      display: flex;
      gap: 14px;
      color: color-mix(in srgb, var(--theme-ink) 63%, rgba(255,255,255,.48));
      font-size: 13px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .button {
      min-width: 74px;
      text-align: center;
      border-radius: 999px;
      padding: 8px 14px;
      color: rgba(255,245,238,.88);
      background:
        linear-gradient(150deg,
          color-mix(in srgb, var(--theme-accent) 30%, rgba(255,255,255,.05)),
          color-mix(in srgb, var(--theme-bg) 56%, rgba(255,255,255,.08))
        );
      border: 1px solid color-mix(in srgb, var(--theme-deep) 32%, rgba(255,255,255,.23));
      box-shadow: inset 0 1px rgba(255,255,255,.18), 0 16px 30px rgba(0,0,0,.24);
      font-size: 13px;
      letter-spacing: .04em;
    }

    .hex-row {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 13px 13px 0;
      color: color-mix(in srgb, var(--theme-ink) 54%, rgba(255,255,255,.38));
      font-size: 13px;
      letter-spacing: .04em;
    }

    .footer-note {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 52px 1fr;
      align-items: center;
      gap: 18px;
      margin-top: 23px;
      border-radius: 999px;
      min-height: 42px;
      padding: 6px 22px 6px 6px;
      color: rgba(229, 198, 183, .68);
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(241, 207, 192, .16);
      box-shadow: inset 0 1px rgba(255,255,255,.10), 0 20px 44px rgba(0,0,0,.22);
      backdrop-filter: blur(20px) saturate(1.12);
      font-size: 14px;
      letter-spacing: .04em;
    }

    .mist-orb {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 42% 35%, rgba(225, 196, 213, .26), transparent 28%),
        radial-gradient(circle at 60% 65%, rgba(154, 101, 126, .20), transparent 42%),
        linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.035));
      border: 1px solid rgba(244, 205, 183, .28);
      box-shadow: inset 0 1px rgba(255,255,255,.28), 0 12px 24px rgba(0,0,0,.30);
    }

    /* Theme token presets */
    [data-theme="smoky-plum"] {
      --theme-bg: #1A121A;
      --theme-soft: #2A1826;
      --theme-mid: #5A3A4D;
      --theme-deep: #D9C6D6;
      --theme-ink: #EAD9EA;
      --theme-accent: #B884A9;
    }

    [data-theme="velvet-negroni"] {
  --theme-bg: #15070A;
  --theme-soft: #2B080D;
  --theme-mid: #67111D;
  --theme-deep: #B89A97;
  --theme-ink: #E8CDC8;
  --theme-accent: #8E1020;
}

    [data-theme="champagne-noir"] {
      --theme-bg: #15161A;
      --theme-soft: #2B2430;
      --theme-mid: #6F643F;
      --theme-deep: #E9DFCE;
      --theme-ink: #EFE5D5;
      --theme-accent: #BFA676;
    }

    [data-theme="dusky-rose-rain"] {
      --theme-bg: #241319;
      --theme-soft: #4D222B;
      --theme-mid: #7E4A55;
      --theme-deep: #C9A3A9;
      --theme-ink: #E3C9CD;
      --theme-accent: #A75D6A;
    }

    [data-theme="copper-twilight"] {
      --theme-bg: #211712;
      --theme-soft: #4A2718;
      --theme-mid: #7B4B2D;
      --theme-deep: #C7A07B;
      --theme-ink: #DEC6AE;
      --theme-accent: #9B6038;
    }

    [data-theme="mauve-afterglow"] {
      --theme-bg: #1C1620;
      --theme-soft: #3A293D;
      --theme-mid: #6F5B77;
      --theme-deep: #DCC6DB;
      --theme-ink: #E7D7E8;
      --theme-accent: #A987B1;
    }

    @media (max-width: 1024px) {
      :root {
        --page-pad-x: 20px;
        --page-pad-top: 26px;
        --theme-min-h: 390px;
      }

      .stage { width: 100vw; }
      .grid { grid-template-columns: 1fr; }
      header { flex-direction: column; }
      .badge { min-width: 0; }
      .footer-note { grid-template-columns: 42px 1fr; border-radius: 24px; }
      .mist-orb { width: 38px; height: 38px; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Here I Am mature micro-tipsy tokenized theme options">
    <div class="rain-layer" aria-hidden="true"></div>

    <header>
      <div>
        <h1>Here I Am · 成熟微醺色彩方向</h1>
        <p class="intro">从“云层与水珠”的轻梦幻，转向“铜光、暗雾、雾面玻璃、醉意皮肤”的成熟质感。</p>
      </div>
      <div class="badge">misted glass · rain trace · mature</div>
    </header>

    <section class="grid" id="themeGrid"></section>

    <section class="footer-note">
      <div class="mist-orb" aria-hidden="true"></div>
      <div>建议：主界面使用抽象暗雾底 + 凝霜半透明；保留水汽高光，但避免真实酒吧背景。</div>
    </section>
  </main>

  <script>
    /**
     * Replaceable design tokens for Codex.
     * Every theme has exactly four palette colors to match the preview board.
     * Use these tokens to map into mobile UI semantic tokens later:
     * background / surface / accent / text / border / shadow / highlight.
     */
    const THEME_TOKENS = [
      {
        id: 'smoky-plum',
        zh: '烟熏梅子夜',
        en: 'SMOKY PLUM',
        notes: '紫烟 / 黑莓 / 暮霭',
        palette: ['#1A121A', '#2A1826', '#5A3A4D', '#D9C6D6']
      },
      {
        id: 'velvet-negroni',
        zh: '丝绒内格罗尼',
        en: 'VELVET NEGRONI',
        notes: '暗正红 / 酒红 / 口红感',
        palette: ['#15070A', '#2B080D', '#67111D', '#B89A97']
      },
      {
        id: 'champagne-noir',
        zh: '香槟黑丝绸',
        en: 'CHAMPAGNE NOIR',
        notes: '香槟 / 黑丝绸 / 老钱感',
        palette: ['#15161A', '#2B2430', '#6F643F', '#E9DFCE']
      },
      {
        id: 'dusky-rose-rain',
        zh: '暮雨玫瑰',
        en: 'DUSKY ROSE RAIN',
        notes: '玫瑰 / 烟粉 / 微醺雨夜',
        palette: ['#241319', '#4D222B', '#7E4A55', '#C9A3A9']
      },
      {
        id: 'copper-twilight',
        zh: '铜暮微光',
        en: 'COPPER TWILIGHT',
        notes: '暗铜 / 琥珀 / 微光',
        palette: ['#211712', '#4A2718', '#7B4B2D', '#C7A07B']
      },
      {
        id: 'mauve-afterglow',
        zh: '暮光紫雾',
        en: 'MAUVE AFTERGLOW',
        notes: '紫雾 / 薰衣草灰 / 夜色余温',
        palette: ['#1C1620', '#3A293D', '#6F5B77', '#DCC6DB']
      }
    ];

    const grid = document.querySelector('#themeGrid');

    grid.innerHTML = THEME_TOKENS.map(theme => `
      <article class="theme" data-theme="${theme.id}">
        <div class="theme-head">
          <div class="title">
            <strong>${theme.zh}</strong>
            <span class="en">${theme.en}</span>
            <div class="notes">${theme.notes}</div>
          </div>
          <div class="swatches" aria-label="${theme.zh} color swatches">
            ${theme.palette.map(color => `<i style="--swatch:${color}" title="${color}"></i>`).join('')}
          </div>
        </div>

        <div class="sample-card">
          <span class="state">需复核</span>
          <h2>周末边界</h2>
          <p>最近你更希望周末保留空白，不想每次都被安排得太满。之后计划约会或外出时，应先确认你的精力状态。</p>
          <div class="quote">“周末不要排太满。”</div>
          <div class="foot">
            <div class="tags"><span>REST</span><span>LIFE</span></div>
            <div class="button">聊聊</div>
          </div>
        </div>

        <div class="hex-row">
          ${theme.palette.map(color => `<span>${color}</span>`).join('')}
        </div>
      </article>
    `).join('');
  </script>

<!--
V4 adjustment:
Velvet Negroni is intentionally NOT bright tomato red.
It uses low-luminance lipstick crimson / oxblood:
- accent #8E1020 only for small UI emphasis
- large surfaces use #15070A / #2B080D / #67111D
Keep this theme dark, velvety, and lipstick-like, not vivid orange-red.
-->

</body>
